<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>Offline · Credo</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0b0f; color: #e7e5e4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 0 40px rgba(99,102,241,.35); }
  h1 { font-size: 22px; margin: 22px 0 8px; color: #fff; letter-spacing: -.01em; }
  p { font-size: 15px; line-height: 1.55; color: #a8a29e; max-width: 340px; margin: 0 0 6px; }
  .card { margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: rgba(99,102,241,.08);
    border: 1px solid rgba(99,102,241,.22); max-width: 360px; text-align: left; font-size: 13.5px; color: #c7d2fe; line-height: 1.5; }
  button { margin-top: 24px; font: inherit; font-size: 15px; font-weight: 600; color: #0a0b0f; background: #fff; border: 0;
    border-radius: 999px; padding: 12px 26px; min-height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Credo">
  <h1>You're offline</h1>
  <p>Credo needs an internet connection to load your balances, transactions and health score, and to talk to the AI coach.</p>
  <div class="card">For your security, Credo never stores your financial data on this device, so nothing is shown while you're offline.</div>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
